name: Unified writing validation

on:
  push:
    branches: [feat/unified-writing-workspace]
  workflow_dispatch:
    inputs:
      research:
        description: Run historical experiments with known failing assertions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: writing-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-gate:
    name: Production editor checks
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate historical editor adapters
        run: node --test scripts/writing-engine-source.test.mjs
      - name: Typecheck harness
        run: npm run typecheck
      - name: Install Chromium
        id: browsers
        run: npx playwright install chromium
      - name: Production editor regression tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npx playwright test --config playwright.writing-native.config.ts --workers=1 --output test-results/writing-native
      - name: Headless Chromium experiment
        if: ${{ !cancelled() && inputs.research == true && steps.browsers.outcome == 'success' }}
        env:
          NOVALIST_WRITING_ENGINE: chromium
        run: npx playwright test --config playwright.writing-feasibility.config.ts --workers=1 --output test-results/writing-feasibility/chromium
      - name: Isolated Electron experiment
        if: ${{ !cancelled() && inputs.research == true && steps.browsers.outcome == 'success' }}
        env:
          NOVALIST_WRITING_ENGINE: electron
          NOVALIST_E2E_ALLOW_DESKTOP: '1'
        run: npx playwright test --config playwright.writing-feasibility.config.ts --workers=1 --output test-results/writing-feasibility/electron
      - name: Upload gate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: writing-feasibility-evidence
          path: app/test-results/
          if-no-files-found: warn
          retention-days: 14
