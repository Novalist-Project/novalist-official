name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push to a pull request cancels that pull request's superseded run.
# A push to main or dev gets a group of its own per commit, so it is never
# cancelled and never replaced while queued: tools/wait_for_release_ci.py needs
# the run on the release commit to finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Each project's coverage is checked against ITS OWN assembly;
  # Check-Coverage.ps1 filters the cobertura report by package name.
  test-sdk-core:
    name: Tests Sdk and Core
    # Matches the dev environment where the headless suites are known green.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET and NuGet cache
        uses: ./.github/actions/dotnet-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        shell: bash
        run: |
          dotnet build tests/Novalist.Sdk.Tests/Novalist.Sdk.Tests.csproj -c Debug
          dotnet build tests/Novalist.Core.Tests/Novalist.Core.Tests.csproj -c Debug

      - name: Test Novalist.Sdk
        run: >-
          dotnet test tests/Novalist.Sdk.Tests/Novalist.Sdk.Tests.csproj
          -c Debug --no-build
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage/sdk

      - name: Test Novalist.Core
        run: >-
          dotnet test tests/Novalist.Core.Tests/Novalist.Core.Tests.csproj
          -c Debug --no-build
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage/core

      - name: Upload Sdk coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-sdk
          path: artifacts/coverage/sdk
          retention-days: 1

      - name: Upload Core coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-core
          path: artifacts/coverage/core
          retention-days: 1

  test-backend:
    name: Tests Backend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET and NuGet cache
        uses: ./.github/actions/dotnet-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build tests/Novalist.Backend.Tests/Novalist.Backend.Tests.csproj -c Debug

      - name: Test Novalist.Backend
        run: >-
          dotnet test tests/Novalist.Backend.Tests/Novalist.Backend.Tests.csproj
          -c Debug --no-build
          --settings tests/coverlet.runsettings
          --results-directory artifacts/coverage/backend

      - name: Upload Backend coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results-backend
          path: artifacts/coverage/backend
          retention-days: 1

  test-sync-tooling:
    name: Tests Sync.Client and repository tooling
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET and NuGet cache
        uses: ./.github/actions/dotnet-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build tests/Novalist.Sync.Client.Tests/Novalist.Sync.Client.Tests.csproj -c Debug

      - name: Test Novalist.Sync.Client
        run: dotnet test tests/Novalist.Sync.Client.Tests/Novalist.Sync.Client.Tests.csproj -c Debug --no-build

      - name: Test repository tooling
        run: python -m unittest discover -s tools -p "test_*.py"

  # Native maximize/fullscreen state needs a desktop window manager. Run
  # this contract on the Windows desktop already used by the backend suite.
  e2e-native-window:
    name: Native window E2E
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the app
        uses: ./.github/actions/e2e-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          install-browsers: 'false'

      - name: Native window E2E
        working-directory: app
        env:
          NOVALIST_E2E_ALLOW_DESKTOP: '1'
        run: npx playwright test e2e/focus-interactions.spec.ts --grep "focus restores window chrome"

      - name: Flaky tests
        if: always()
        working-directory: app
        run: node scripts/flaky-report.mjs --shard native-window

      - name: Upload native window traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-native-window-traces
          path: |
            app/test-results/
            app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Measures the three assemblies from the test jobs' cobertura results, publishes
  # the badge number, then enforces the threshold. It runs only when both test
  # jobs passed, as the single-job pipeline did.
  coverage:
    name: 100% coverage
    needs: [test-sdk-core, test-backend]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the coverage badge JSON to the `badges` branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Sdk coverage results
        uses: actions/download-artifact@v4
        with:
          name: coverage-results-sdk
          path: artifacts/coverage/sdk

      - name: Download Core coverage results
        uses: actions/download-artifact@v4
        with:
          name: coverage-results-core
          path: artifacts/coverage/core

      - name: Download Backend coverage results
        uses: actions/download-artifact@v4
        with:
          name: coverage-results-backend
          path: artifacts/coverage/backend

      # Measure only (never fails) so the badge can be published with the real number
      # — including when coverage has dropped below the threshold — before we fail the build.
      - name: Measure coverage
        id: coverage
        shell: pwsh
        run: |
          $sdk     = ./eng/Check-Coverage.ps1 -NoFail -CoberturaGlob 'artifacts/coverage/sdk/**/coverage.cobertura.xml'     -Package 'Novalist.Sdk'
          $core    = ./eng/Check-Coverage.ps1 -NoFail -CoberturaGlob 'artifacts/coverage/core/**/coverage.cobertura.xml'    -Package 'Novalist.Core'
          $backend = ./eng/Check-Coverage.ps1 -NoFail -CoberturaGlob 'artifacts/coverage/backend/**/coverage.cobertura.xml' -Package 'Novalist.Backend'
          # Each script emits "<Package>=<rate>" as its last stdout line.
          $rows = @($sdk, $core, $backend) | ForEach-Object { ($_ | Select-Object -Last 1) }
          "## Coverage (line)`n`n| Assembly | Coverage |`n| --- | --- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $rates = @()
          foreach ($r in $rows) {
            $name, $rate = $r -split '='
            "| $name | $rate% |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $rates += [double]$rate
          }
          $overall = ($rates | Measure-Object -Minimum).Minimum   # lowest assembly rate
          "coverage=$overall" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Publish the measured number BEFORE enforcing, so a drop below 100% still
      # updates the badge (the build then fails on the next step).
      - name: Publish coverage badge
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.coverage.outputs.coverage != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./eng/Publish-CoverageBadge.ps1 -Coverage '${{ steps.coverage.outputs.coverage }}' -Repository '${{ github.repository }}'

      - name: Enforce 100% line coverage
        if: always() && steps.coverage.outputs.coverage != ''
        shell: pwsh
        run: |
          $overall = [double]'${{ steps.coverage.outputs.coverage }}'
          if ($overall -lt 100) { throw "Coverage $overall% is below the required 100%." }
          Write-Host "Coverage gate passed: $overall%"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

  checks:
    name: Electron app checks (typecheck, build, tooling)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test packaging patches
        working-directory: app
        run: npm run test:packaging

      - name: Test window transport and coordination
        working-directory: app
        run: npm run test:transport

      - name: Test source inspection and release tooling
        run: >-
          python3 -m unittest tools/test_html_sources.py tools/test_file_doctor.py
          tools/test_changelog.py tools/test_wait_for_release_ci.py tools/test_release_metadata.py
          tools/test_discord_release.py tools/test_apple_release_uploads.py

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      # Shared with .githooks/pre-commit; runs every doctor even if one fails.
      - name: Source checks (locales, manual, tokens, files, RPC, placement, bridge)
        run: python3 tools/check-source.py

      - name: Build renderer
        working-directory: app
        run: npm run build

      - name: Build mobile renderer
        working-directory: app
        run: npm run build:mobile

  # The credential-store and launch-path specs below are also part of the sharded
  # suite. They run here once, in parallel with the shards, so a broken isolated
  # keyring or launcher shows up as one clearly named failing job instead of as
  # the same failure in all four shards.
  e2e-smoke:
    name: E2E launch and credential-store smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the app
        uses: ./.github/actions/e2e-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run smoke specs
        uses: ./.github/actions/e2e-run
        with:
          playwright-args: e2e/linux-credential-store.spec.ts e2e/collaboration-account.spec.ts e2e/collaboration-peer.spec.ts e2e/m38-context-menu-groups.spec.ts
          label: smoke
          artifact-name: playwright-traces-smoke

  e2e:
    name: E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the app
        uses: ./.github/actions/e2e-setup
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run shard
        uses: ./.github/actions/e2e-run
        with:
          playwright-args: --shard=${{ matrix.shard }}/4
          label: ${{ matrix.shard }}/4
          artifact-name: playwright-traces-shard-${{ matrix.shard }}

  # One stable check to require: it fails unless every job above succeeded.
  ci-gate:
    name: CI gate
    if: always()
    needs: [test-sdk-core, test-backend, test-sync-tooling, e2e-native-window, coverage, checks, e2e-smoke, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
